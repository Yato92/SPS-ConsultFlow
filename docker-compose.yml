version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: consultflow-db
    environment:
      POSTGRES_DB: consultflow
      POSTGRES_USER: consultflow
      POSTGRES_PASSWORD: consultflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consultflow -d consultflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: consultflow-backend
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:-consultflow-docker-secret-change-me}
      DATABASE_URL: postgresql+psycopg://consultflow:consultflow@db:5432/consultflow
      BOT_API_TOKEN: ${BOT_API_TOKEN:-dev-bot-token-change-me}
      MANAGER_TELEGRAM_IDS: ${MANAGER_TELEGRAM_IDS:-}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      SEED_DEMO: "true"
      PROTOTYPE_DEMO: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@consultflow.ru}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      AI_ENABLED: ${AI_ENABLED:-true}
      POLZA_API_KEY: ${POLZA_API_KEY:-}
      POLZA_BASE_URL: ${POLZA_BASE_URL:-https://polza.ai/api/v1}
      AI_MODEL: ${AI_MODEL:-deepseek/deepseek-v4.1-flash-1017}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.4}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1200}
      AI_TIMEOUT: ${AI_TIMEOUT:-90}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  bot:
    build: ./bot
    container_name: consultflow-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      BACKEND_URL: http://backend:8000
      BOT_API_TOKEN: ${BOT_API_TOKEN:-dev-bot-token-change-me}
      MANAGER_TELEGRAM_IDS: ${MANAGER_TELEGRAM_IDS:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      PROTOTYPE_URL: http://localhost:8080/prototype/
      AI_ENABLED: ${AI_ENABLED:-true}
      POLZA_API_KEY: ${POLZA_API_KEY:-}
      POLZA_BASE_URL: ${POLZA_BASE_URL:-https://polza.ai/api/v1}
      AI_MODEL: ${AI_MODEL:-deepseek/deepseek-v4.1-flash-1017}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.4}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1200}
      AI_TIMEOUT: ${AI_TIMEOUT:-90}
      AI_HISTORY_LIMIT: ${AI_HISTORY_LIMIT:-12}
      AI_EXTRA_PROMPT: ${AI_EXTRA_PROMPT:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["bot"]

  vk-bot:
    build: ./bot
    container_name: consultflow-vk-bot
    command: ["python", "-m", "vk_bot.main"]
    environment:
      VK_GROUP_ID: ${VK_GROUP_ID:-}
      VK_TOKEN: ${VK_TOKEN:-}
      BACKEND_URL: http://backend:8000
      BOT_API_TOKEN: ${BOT_API_TOKEN:-dev-bot-token-change-me}
      MANAGER_TELEGRAM_IDS: ${MANAGER_TELEGRAM_IDS:-}
      PROTOTYPE_URL: http://localhost:8080/prototype/
      AI_ENABLED: ${AI_ENABLED:-true}
      POLZA_API_KEY: ${POLZA_API_KEY:-}
      POLZA_BASE_URL: ${POLZA_BASE_URL:-https://polza.ai/api/v1}
      AI_MODEL: ${AI_MODEL:-deepseek/deepseek-v4.1-flash-1017}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.4}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1200}
      AI_TIMEOUT: ${AI_TIMEOUT:-90}
      AI_HISTORY_LIMIT: ${AI_HISTORY_LIMIT:-12}
      AI_EXTRA_PROMPT: ${AI_EXTRA_PROMPT:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["vk"]

  frontend:
    build: ./frontend
    container_name: consultflow-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
